<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a0b">
  <title>GRAVITY FOUR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="menu" id="menu" aria-label="Tournament selection">
      <header class="brand"><h1>GRAVITY FOUR</h1></header>
      <p class="menu-lead">SELECT TOURNAMENT</p>
      <div class="tournament-list" id="tournament-list"></div>
      <a class="help-button" href="help.html">HOW TO PLAY</a>
    </section>
    <section class="stage" id="stage" aria-label="Gravity Four" hidden>
      <div class="match-bar"><button class="back-button" id="back" type="button">← MENU</button><span id="match-progress"></span></div>
      <div class="arena">
        <div class="board-column">
          <div class="scoreboard" id="human-card" aria-label="Four-in-a-row score">
            <p class="speech" id="speech" role="status" aria-live="polite" hidden></p>
            <div class="enemy-portrait"><img id="opponent-face" alt="" width="150" height="150"><div class="thinking" id="thinking" hidden>THINKING<span aria-hidden="true">···</span></div></div>
            <span class="score-you">YOU</span><strong id="human-score">0</strong><span class="score-dash">-</span><strong id="com-score">0</strong><span id="score-opponent-name"></span>
          </div>
          <div class="board-frame" id="board-frame">
            <div class="board" id="board" role="grid" aria-label="Ten by ten crystal board"><canvas class="board-art" id="board-art" width="320" height="320" aria-hidden="true"></canvas></div>
            <div class="result" id="result" role="status" aria-live="polite" hidden></div>
          </div>
        </div>
      </div>
      <div class="victory-effect" id="victory-effect" aria-hidden="true" hidden>
        <div class="victory-ring ring-one"></div><div class="victory-ring ring-two"></div>
        <div class="victory-particles" id="victory-particles"></div>
        <div class="victory-message"><span id="victory-kicker"></span><strong id="victory-title"></strong><span id="victory-subtitle"></span></div>
      </div>
      <section class="tournament-recap" id="tournament-recap" aria-label="Tournament standings" hidden>
        <div class="recap-card"><div class="recap-head"><span class="eyebrow">TOURNAMENT UPDATE</span><h2 id="recap-title"></h2><p id="recap-subtitle"></p></div><div class="bracket-rounds" id="bracket-rounds"></div><div class="match-actions" id="match-actions" hidden><button id="next-match" type="button"></button><button id="menu-after" type="button">MENU</button></div></div>
      </section>
    </section>
  </main>
  <button class="place-button" id="place" type="button" disabled>PLACE</button>
  <script src="characters.js"></script>
  <script src="game.js"></script>
</body>
</html>
